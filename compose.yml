# Whole PlanLos stack, built from the cloned repos (./clone.sh first).
# Configure via .env (see .env.example), then: docker compose up -d --build
services:
  db:
    image: localhost/planlos-db:latest
    build: ./planlos-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "127.0.0.1:${DB_PORT:-8003}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: localhost/planlos-server:latest
    build: ./planlos-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://planlos:${POSTGRES_PASSWORD}@db:5432/planlos?sslmode=disable
      NO_AUTH: ${NO_AUTH:-}
    ports:
      - "${SERVER_PORT:-8004}:8004"
    volumes:
      - backups:/root/backups

  web:
    image: localhost/planlos-web:latest
    build:
      context: ./planlos-web
      args:
        URL_BASE: ${URL_BASE:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    depends_on: [server]
    environment:
      API_UPSTREAM: http://server:8004
    ports:
      - "${WEB_PORT:-8002}:80"
    volumes:
      - ./planlos-web/settings.yml:/usr/share/nginx/html/settings.yml:ro

  # Optional, uncomment to include
  # docs:
  #   image: localhost/planlos-docs:latest
  #   build: ./planlos-docs
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:${DOCS_PORT:-8001}:80"

volumes:
  db-data:
  backups:
